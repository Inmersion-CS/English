name: Feature request
description: Propose an English-learning improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes: {label: Learner need, description: What communication problem should this solve?}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed experience, description: Describe the smallest useful version.}
    validations: {required: true}
